<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warteschlange in der Arztpraxis</title>
  <style>
    :root {
      --bg: #0f172a; --card: #111827; --muted: #94a3b8; --text: #e5e7eb;
      --accent: #22c55e; --warn: #f59e0b; --danger: #ef4444; --soft: #1f2937; --border: #374151;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px}
    h1{font-size:28px;margin:0 0 16px;text-align:center}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 8px 20px rgb(0 0 0 / 0.35)}
    .muted{color:var(--muted)}
    .hint{margin:12px 0 0;font-size:13px;color:#cbd5e1}

    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    input,button{border-radius:12px;border:1px solid var(--border);background:var(--soft);color:var(--text)}
    input{padding:10px 12px;flex:1}
    button{padding:10px 14px;cursor:pointer;border:1px solid transparent}
    button.primary{background:var(--accent);color:#052e16}
    button.danger{background:var(--danger)}
    button.ghost{background:transparent;border-color:var(--border)}
    button.warn { background: #f59e0b; color: #2a1700; }


    .queue{display:flex;gap:10px;align-items:flex-end;min-height:96px;padding:12px;border:1px dashed var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,0.03),rgba(255,255,255,0.01))}
    .box{position:relative;min-width:92px;max-width:140px;flex:0 0 auto;padding:10px 12px;border:1px solid var(--border);background:#0b1220;border-radius:14px;text-align:center;transition:transform .28s ease, opacity .28s ease}
    .box.new{transform:translateY(-6px)}
    .badge{position:absolute;top:-10px;left:-10px;background:var(--soft);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:999px}
    .marker{font-size:12px;color:var(--muted);margin:0 6px}

    .log{height:180px;overflow:auto;background:#0b1220;border:1px solid var(--border);border-radius:12px;padding:8px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;font-size:12px;margin-top:12px}
    .log p{margin:4px 0}

    @media (max-width: 600px){ .wrap{max-width:100%} }
  
*{box-sizing:border-box}
.wrap{max-width:1100px}
/* Eine zusammenhängende Kette darf nicht umbrechen: bei Bedarf seitlich scrollen. */
.queue { display:block; width:100%; min-width:0; min-height:176px; max-height:none; padding:10px 12px;
  overflow-x:auto; overflow-y:hidden; border:1px dashed var(--border); border-radius:12px;
  background:#0b1220; scrollbar-color:#64748b #0b1220; }
.linked-chain { display:flex; flex-wrap:nowrap; align-items:flex-start; width:max-content; min-width:100%; padding:0 4px 4px; }
.node-wrapper { position:relative; flex:0 0 190px; width:190px; padding-top:44px; }
.linked-node { display:flex; height:86px; background:#111c30; border:1px solid #5e718e; border-radius:10px; overflow:hidden; }
.node-content { min-width:0; flex:1; display:flex; flex-direction:column; justify-content:center; gap:5px; padding:10px; }
.node-key { color:#a8b8ce; font-size:10px; line-height:13px; font-family:ui-monospace,monospace; }
.node-name { color:#f1f5f9; font-size:14px; line-height:17px; font-weight:600; overflow-wrap:anywhere;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.node-next { position:relative; flex:0 0 63px; width:63px; border-left:1px solid #5e718e; color:#67e8f9; }
.node-next .node-key { position:absolute; top:9px; left:0; width:100%; text-align:center; }
.pointer-dot { position:absolute; left:50%; top:50%; width:7px; height:7px; border-radius:50%; background:#67e8f9; transform:translate(-50%,-50%); }
.node-next::after { content:''; position:absolute; top:50%; left:50%; right:-1px; height:2px; background:#67e8f9; transform:translateY(-50%); }
.next-link { flex:0 0 44px; width:44px; height:130px; padding-top:44px; display:flex; align-items:center; color:#67e8f9; }
.successor-arrow { display:block; width:44px; height:20px; flex-shrink:0; }
.node-reference { position:absolute; top:0; width:64px; height:44px; display:flex; flex-direction:column; align-items:center; font-size:12px; line-height:16px; font-weight:700; }
.node-reference.head { left:10px; color:#93c5fd; }
.node-reference.tail { right:8px; color:#fbbf24; }
.reference-arrow { display:block; width:16px; height:26px; }
.null-wrapper { flex:0 0 54px; padding-top:44px; height:130px; display:flex; align-items:center; }
.null-value { color:#e2e8f0; font-size:14px; font-family:ui-monospace,monospace; padding:5px 7px; border:1px solid #64748b; border-radius:6px; background:#172033; }
.empty-chain { min-height:140px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; }
.empty-diagram { display:grid; grid-template-columns:44px 96px 48px; grid-template-rows:40px 40px; column-gap:6px; align-items:center; }
.empty-reference { display:flex; align-items:center; font-size:13px; }
.empty-reference.head { grid-column:1; grid-row:1; color:#93c5fd; }
.empty-reference.tail { grid-column:1; grid-row:2; color:#fbbf24; }
.empty-arrows { grid-column:2; grid-row:1 / 3; width:96px; height:80px; }
.empty-head-path { color:#93c5fd; }
.empty-tail-path { color:#fbbf24; }
.empty-diagram > .null-value { grid-column:3; grid-row:1 / 3; justify-self:start; padding:0; border:0; background:transparent; font-size:16px; }
.empty-label { margin:0; color:var(--muted); text-align:center; font-size:13px; }
.structure-note { margin:10px 0 14px; color:#cbd5e1; font-size:13px; line-height:1.5; }
.structure-note code { color:#a5f3fc; font-size:12px; }
.linked-node.new { animation:node-appears .5s ease-out; }
@keyframes node-appears { from { background:#164e3d; box-shadow:0 0 0 2px #22c55e; } to { background:#111c30; box-shadow:none; } }
@media (prefers-reduced-motion:reduce) { .linked-node.new { animation:none; } }
@media (max-width:600px) { .queue { padding:8px; } .structure-note { font-size:12px; } }

</style>
</head>
<body>
  <div class="wrap">
    <h1>Warteschlange in der Arztpraxis</h1>

    <div class="card">
      <p class="structure-note">Verkettete Implementierung: Jeder Knoten enthält einen Patientennamen und den Verweis <code>nextNode</code>. Die Pfeile zeigen gespeicherte Verweise, keine Bewegungsrichtung.</p>

      <div class="queue" id="queue" tabindex="0" aria-label="Verkettete Queue"></div>
      <p class="hint">Hinweis: <strong>Bearbeite mit Hilfe dieses Programms die Aufgaben auf dem Arbeitsblatt.</strong></p>

      <div class="row">
        <input id="itemInput" placeholder="ContentType pContent" aria-label="Parameter für enqueue" />
        <button class="primary" id="addBtn">enqueue</button>
        <button class="danger" id="deqBtn">dequeue</button>
        <button id="frontBtn" class="warn">front</button>
        <button id="emptyBtn" class="ghost">isEmpty</button>
      </div>

      <div class="log" id="log" aria-live="polite"></div>
    </div>
  </div>

  <script>
// Die gleiche verkettete Struktur wie in Queue.java: head, tail, content, nextNode.
let nextQueueNodeId = 1;
class QueueNode {
  constructor(content) {
    this.id = 'knoten-' + nextQueueNodeId++;
    this.content = content;
    this.nextNode = null;
  }
}
class LinkedQueue {
  constructor(contents = []) {
    this.head = null;
    this.tail = null;
    contents.forEach(content => this.enqueue(content));
  }
  isEmpty() { return this.head === null; }
  front() { return this.isEmpty() ? null : this.head.content; }
  enqueue(content) {
    if (content === null || content === undefined) return;
    const node = new QueueNode(content);
    if (this.isEmpty()) this.head = node;
    else this.tail.nextNode = node;
    this.tail = node;
  }
  dequeue() {
    if (this.isEmpty()) return;
    this.head = this.head.nextNode;
    if (this.head === null) this.tail = null;
  }
  toArray() {
    const values = [];
    for (let node = this.head; node !== null; node = node.nextNode) values.push(node.content);
    return values;
  }
}

function queueArrow(label, down = false) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', down ? '0 0 16 26' : '0 0 44 20');
  svg.setAttribute('class', down ? 'reference-arrow' : 'successor-arrow');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', label);
  const line = document.createElementNS(ns, 'path');
  line.setAttribute('d', down ? 'M8 1V20' : 'M0 10H35');
  line.setAttribute('fill', 'none');
  line.setAttribute('stroke', 'currentColor');
  line.setAttribute('stroke-width', '2');
  const tip = document.createElementNS(ns, 'path');
  tip.setAttribute('d', down ? 'M2 17L8 25L14 17Z' : 'M33 4L43 10L33 16Z');
  tip.setAttribute('fill', 'currentColor');
  svg.appendChild(line);
  svg.appendChild(tip);
  return svg;
}

function renderLinkedQueue(container, queue) {
  const previousScroll = container.scrollLeft || 0;
  container.replaceChildren();
  container.dataset.head = queue.head ? queue.head.id : 'null';
  container.dataset.tail = queue.tail ? queue.tail.id : 'null';
  container.setAttribute('role', 'group');
  container.setAttribute('aria-label', queue.isEmpty()
    ? 'Leere Queue. head und tail zeigen auf null.'
    : 'Verkettete Queue von vorn nach hinten: ' + queue.toArray().join(', '));
  if (queue.isEmpty()) {
    const empty = document.createElement('div');
    empty.className = 'empty-chain';
    const diagram = document.createElement('div');
    diagram.className = 'empty-diagram';
    const nullId = container.id + '-empty-null';
    ['head', 'tail'].forEach(reference => {
      const row = document.createElement('div');
      row.className = 'empty-reference ' + reference;
      row.setAttribute('aria-describedby', nullId);
      const name = document.createElement('code');
      name.textContent = reference;
      row.appendChild(name);
      diagram.appendChild(row);
    });
    const arrows = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    arrows.setAttribute('class', 'empty-arrows');
    arrows.setAttribute('viewBox', '0 0 110 80');
    arrows.setAttribute('role', 'img');
    arrows.setAttribute('aria-label', 'head und tail haben beide den Wert null');
    arrows.innerHTML = '<path class="empty-head-path" d="M0 18H36C62 18 62 34 98 34" fill="none" stroke="currentColor" stroke-width="2" />'
      + '<path class="empty-head-path" d="M98 28L110 34L98 40Z" fill="currentColor" />'
      + '<path class="empty-tail-path" d="M0 62H36C62 62 62 46 98 46" fill="none" stroke="currentColor" stroke-width="2" />'
      + '<path class="empty-tail-path" d="M98 40L110 46L98 52Z" fill="currentColor" />';
    const nil = document.createElement('code');
    nil.className = 'null-value';
    nil.id = nullId;
    nil.textContent = 'null';
    diagram.append(arrows, nil);
    empty.appendChild(diagram);
    const explanation = document.createElement('p');
    explanation.className = 'empty-label';
    explanation.textContent = 'Die Queue ist leer. Es gibt keine Knoten.';
    empty.appendChild(explanation);
    container.appendChild(empty);
    return;
  }
  const chain = document.createElement('div');
  chain.className = 'linked-chain';
  for (let node = queue.head; node !== null; node = node.nextNode) {
    const wrapper = document.createElement('div');
    wrapper.className = 'node-wrapper';
    [['head', queue.head], ['tail', queue.tail]].forEach(([reference, target]) => {
      if (target !== node) return;
      const marker = document.createElement('div');
      marker.className = 'node-reference ' + reference;
      marker.dataset.target = node.id;
      const text = document.createElement('code');
      text.textContent = reference;
      marker.append(text, queueArrow(reference + ' zeigt auf diesen Knoten', true));
      wrapper.appendChild(marker);
    });
    const card = document.createElement('div');
    card.className = 'linked-node';
    card.dataset.nodeId = node.id;
    card.dataset.next = node.nextNode ? node.nextNode.id : 'null';
    if (node === queue.head) card.classList.add('is-head');
    if (node === queue.tail) card.classList.add('is-tail');
    const content = document.createElement('div');
    content.className = 'node-content';
    const contentKey = document.createElement('span');
    contentKey.className = 'node-key';
    contentKey.textContent = 'Inhalt';
    const value = document.createElement('span');
    value.className = 'node-name';
    value.textContent = node.content;
    value.title = node.content;
    content.append(contentKey, value);
    const next = document.createElement('div');
    next.className = 'node-next';
    const nextKey = document.createElement('code');
    nextKey.className = 'node-key';
    nextKey.textContent = 'nextNode';
    const dot = document.createElement('span');
    dot.className = 'pointer-dot';
    dot.setAttribute('aria-hidden', 'true');
    next.append(nextKey, dot);
    card.append(content, next);
    wrapper.appendChild(card);
    chain.appendChild(wrapper);
    const link = document.createElement('div');
    link.className = 'next-link';
    link.dataset.from = node.id;
    link.dataset.to = node.nextNode ? node.nextNode.id : 'null';
    link.appendChild(queueArrow(node.nextNode
      ? 'nextNode zeigt auf den Knoten mit ' + node.nextNode.content
      : 'nextNode des letzten Knotens zeigt auf null'));
    chain.appendChild(link);
  }
  const end = document.createElement('div');
  end.className = 'null-wrapper';
  const nil = document.createElement('code');
  nil.className = 'null-value';
  nil.textContent = 'null';
  end.appendChild(nil);
  chain.appendChild(end);
  container.appendChild(chain);
  container.scrollLeft = previousScroll;
}

    const firstNames = ["Anna","Ben","Clara","David","Emma","Felix","Greta","Henry","Isabel","Jonas"];
    const lastNames  = ["Müller","Schmidt","Schneider","Fischer","Weber","Meyer","Wagner","Becker","Hoffmann","Schäfer"];

    const state = { queue: new LinkedQueue() };
    const $ = sel => document.querySelector(sel);
    const logEl = $('#log');

    function log(msg){
      const p=document.createElement('p');
      const t=new Date().toLocaleTimeString();
      p.textContent=`[${t}] ${msg}`;
      logEl.appendChild(p);
      logEl.scrollTop=logEl.scrollHeight;
    }

    function render(){
      renderLinkedQueue($('#queue'), state.queue);
    }

    function randomPatient(){
      const first=firstNames[Math.floor(Math.random()*firstNames.length)];
      const last =lastNames[Math.floor(Math.random()*lastNames.length)];
      return `${first} ${last}`;
    }

    function enqueue(val){
      const v = (val && val.trim());
      if(!v){ return; }
      state.queue.enqueue(v);
      log(`enqueue( "${v}" )`);
      render();
      animateNew();
      $('#itemInput').value = ""; // Eingabefeld leeren
    }


    function dequeue(){
      if(state.queue.isEmpty()){
        log('dequeue() – Queue leer, keine Änderung.');
        return;
      }
      state.queue.dequeue();
      log(`dequeue()`);
      render();
    }

    function isEmpty(){
      log(state.queue.isEmpty() ? 'isEmpty(): true' : 'isEmpty(): false');
    }

    function front(){
      if(state.queue.isEmpty()){
        log('front(): null');
        return;
      }
      log(`front(): ${state.queue.front()}`);
    }

    function animateNew(){
      const q=$('#queue');
      const boxes=q.querySelectorAll('.linked-node');
      const last=boxes[boxes.length-1];
      if(last){
        last.classList.add('new');
        setTimeout(()=> last.classList.remove('new'), 280);
      }
    }

    $('#addBtn').onclick  = () => enqueue($('#itemInput').value);
    $('#deqBtn').onclick  = () => dequeue();
    $('#emptyBtn').onclick= () => isEmpty();
    $('#frontBtn').onclick= () => front();
    $('#itemInput').addEventListener('keydown', event => { if (event.key === 'Enter') enqueue($('#itemInput').value); });

    function seedQueue(){ for(let i=0;i<3;i++) enqueue(randomPatient()); }

    // initial befüllen
    seedQueue();
  </script>
</body>
</html>
